services:
  - type: web
    name: python-in-practice
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_BASE_URL
        value: https://code.pip.abrdns.com
      - key: DISCORD_WEBHOOK_URL
        value: https://discord.com/api/webhooks/1543064103042555906/9xO8TnZyi19K5kbEChZMqlFoB57LfVbrvGEK8C_SyjSn4icI4UG2JiKAW6XHzSlAlti7
