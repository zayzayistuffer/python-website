<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset your password</title>
  <link rel="stylesheet" href="static/styles.css">
</head>
<body class="auth-required">
  <div class="page-shell">
    <header class="site-header">
      <a class="brand-lockup" href="/" aria-label="Python in Practice home">
        <img src="https://www.python.org/static/community_logos/python-logo.png" alt="Python logo">
        <span>Python in Practice</span>
      </a>
    </header>

    <main>
      <section class="section-pad auth-reset-page">
        <div class="auth-panel open" id="reset-panel" style="display:block; width:min(100%,560px); margin:48px auto 0;">
          <form class="auth-box" id="reset-form">
            <p class="eyebrow">Secure access</p>
            <h2>Reset your<br><i>password.</i></h2>
            <label for="new-password">New password</label>
            <input id="new-password" type="password" required minlength="8" autocomplete="new-password">
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password">
            <button id="reset-submit" type="submit">Update password</button>
            <p class="auth-message" id="reset-message"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const resetForm = document.querySelector('#reset-form');
    const resetMessage = document.querySelector('#reset-message');
    const resetSubmit = document.querySelector('#reset-submit');
    const newPasswordInput = document.querySelector('#new-password');
    const confirmPasswordInput = document.querySelector('#confirm-password');
    const supabaseClient = window.supabase && !window.SUPABASE_URL.startsWith('YOUR_') && !window.SUPABASE_ANON_KEY.startsWith('YOUR_')
      ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
      : null;

    async function applyRecoverySession() {
      const hash = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      const type = hash.get('type');

      if (!supabaseClient) {
        resetMessage.textContent = 'Add your Supabase URL and anon key before using password recovery.';
        return;
      }

      if (type === 'recovery' && accessToken && refreshToken) {
        const { data, error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });

        if (error) {
          resetMessage.textContent = error.message || 'The recovery link is invalid or expired.';
          return;
        }

        if (data?.user) {
          resetMessage.textContent = 'Your recovery link is active. Enter a new password to continue.';
        }
      }
    }

    async function submitReset(event) {
      event.preventDefault();
      if (!supabaseClient) {
        resetMessage.textContent = 'Add your Supabase URL and anon key first.';
        return;
      }

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 8) {
        resetMessage.textContent = 'Your password must be at least 8 characters.';
        return;
      }

      if (newPassword !== confirmPassword) {
        resetMessage.textContent = 'Passwords do not match.';
        return;
      }

      resetSubmit.disabled = true;
      resetMessage.textContent = 'Updating your password...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      resetSubmit.disabled = false;

      if (error) {
        resetMessage.textContent = error.message || 'Unable to update your password.';
        return;
      }

      resetMessage.textContent = 'Password updated. You can sign in with your new password.';
      resetForm.reset();
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    }

    resetForm.addEventListener('submit', submitReset);
    applyRecoverySession();
    newPasswordInput.focus();
  </script>
</body>
</html>
